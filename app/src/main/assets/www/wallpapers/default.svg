<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.55" stop-color="#1b1b4b"/>
      <stop offset="1" stop-color="#0a2a3a"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#base)"/>
  <g filter="url(#soft)">
    <circle cx="420" cy="300" r="360" fill="#7a4dff" opacity="0.65"/>
    <circle cx="1500" cy="260" r="320" fill="#00c2d1" opacity="0.5"/>
    <circle cx="1100" cy="860" r="420" fill="#ff5ea8" opacity="0.4"/>
    <circle cx="260" cy="900" r="280" fill="#2b6cff" opacity="0.5"/>
  </g>
</svg>
